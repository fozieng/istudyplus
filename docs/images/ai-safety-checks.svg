<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How AI output is checked before a student sees it</title>
  <desc id="desc">A request goes to an AI model. The reply must pass a shape check and a meaning check in code. If it fails, the AI gets one retry with the checker's complaint. If it still fails, it is stopped and never shown. Tests use a fake AI client.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">How AI output is checked before a student sees it</text>
  <text x="40" y="78" font-size="14" fill="#475569">The AI writes. Code decides what a student sees.</text>

  <!-- Main flow arrows -->
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M210 250 H250"/>
    <path d="M430 250 H470"/>
    <path d="M670 250 H710"/>
    <path d="M920 250 H960"/>
  </g>
  <text x="940" y="238" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>

  <!-- Fail branch -->
  <g fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)">
    <path d="M815 300 V380"/>
  </g>
  <text x="826" y="345" font-size="12" font-weight="600" fill="#dc2626">fail</text>
  <g fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowAmber)">
    <path d="M640 420 H340 V304"/>
  </g>
  <text x="490" y="410" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">try again, with the complaint</text>
  <g fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)">
    <path d="M815 460 V506"/>
  </g>
  <text x="826" y="488" font-size="12" font-weight="600" fill="#dc2626">still wrong</text>

  <!-- Boxes -->
  <rect x="40" y="200" width="170" height="100" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="125" y="240" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Request</text>
  <text x="125" y="264" font-size="12" fill="#475569" text-anchor="middle">study plan · lesson</text>
  <text x="125" y="281" font-size="12" fill="#475569" text-anchor="middle">· exercise</text>

  <rect x="250" y="200" width="180" height="100" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="340" y="240" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">AI model</text>
  <text x="340" y="264" font-size="12" fill="#475569" text-anchor="middle">OpenAI · Anthropic</text>

  <rect x="470" y="200" width="200" height="100" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="570" y="236" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Check 1 · Shape</text>
  <text x="570" y="261" font-size="12" fill="#475569" text-anchor="middle">structured output:</text>
  <text x="570" y="278" font-size="12" fill="#475569" text-anchor="middle">valid JSON, exact fields</text>

  <rect x="710" y="200" width="210" height="100" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="815" y="236" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Check 2 · Meaning</text>
  <text x="815" y="261" font-size="12" fill="#475569" text-anchor="middle">every item is real,</text>
  <text x="815" y="278" font-size="12" fill="#475569" text-anchor="middle">allowed &amp; opens correctly</text>

  <rect x="960" y="200" width="200" height="100" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1060" y="240" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Student sees it</text>
  <text x="1060" y="264" font-size="12" fill="#475569" text-anchor="middle">only checked content</text>

  <rect x="640" y="380" width="350" height="80" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="815" y="414" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">One retry</text>
  <text x="815" y="438" font-size="12" fill="#475569" text-anchor="middle">the AI is told exactly what the checker rejected</text>

  <rect x="690" y="506" width="250" height="64" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="815" y="535" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">Stopped</text>
  <text x="815" y="556" font-size="12" fill="#991b1b" text-anchor="middle">never reaches a student</text>

  <!-- Testing note -->
  <rect x="40" y="470" width="280" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="502" font-size="14" font-weight="700" fill="#0f172a">Tested like everything else</text>
  <text x="60" y="527" font-size="12" fill="#475569">The AI client is injected, so tests</text>
  <text x="60" y="546" font-size="12" fill="#475569">run against a fake AI: fast, free,</text>
  <text x="60" y="565" font-size="12" fill="#475569">and no API key needed.</text>
</svg>
