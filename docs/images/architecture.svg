<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="600" viewBox="0 0 1210 600" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">iStudy+ high-level architecture</title>
  <desc id="desc">Student and staff React apps call a Django REST API with an adaptive engine. The backend uses PostgreSQL, Redis and Celery background jobs, which call AI providers and object storage. GitHub Actions deploys the backend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1210" height="600" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#0f172a">iStudy+ · high-level architecture</text>

  <g transform="translate(0,40)">
    <!-- Groups -->
    <rect x="30" y="60" width="220" height="300" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="140" y="86" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">Clients</text>

    <rect x="310" y="60" width="280" height="300" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="450" y="82" font-size="13" font-weight="700" fill="#4338ca" text-anchor="middle">Backend · Django + DRF</text>
    <text x="450" y="99" font-size="11" fill="#4338ca" text-anchor="middle">Azure App Service</text>

    <rect x="650" y="60" width="240" height="300" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="770" y="86" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">Background jobs</text>

    <!-- Edges (drawn first so boxes sit on top) -->
    <g fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M230 145 H340"/>
      <path d="M230 275 L340 170"/>
      <path d="M430 180 V240"/>
      <path d="M430 310 V430"/>
      <path d="M545 180 V430"/>
      <path d="M560 130 H620 V475 H675"/>
      <path d="M675 150 H660 V450 H675"/>
      <path d="M770 430 V310"/>
      <path d="M865 255 L950 165"/>
      <path d="M865 275 H950"/>
      <path d="M865 295 H905 V540 H480 V500"/>
      <path d="M560 118 H605 V40 H1185 V465 H1160"/>
      <path d="M230 465 H325 V360" stroke-dasharray="6 5"/>
    </g>
    <text x="266" y="137" font-size="10" fill="#475569" text-anchor="middle">HTTPS · JSON</text>
    <text x="278" y="457" font-size="10" fill="#475569" text-anchor="middle">deploys</text>

    <!-- Client boxes -->
    <g>
      <rect x="50" y="110" width="180" height="70" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
      <text x="140" y="140" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Student app</text>
      <text x="140" y="161" font-size="11" fill="#475569" text-anchor="middle">React · Vite · EN / AR / HE</text>

      <rect x="50" y="240" width="180" height="70" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
      <text x="140" y="270" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Staff app</text>
      <text x="140" y="291" font-size="11" fill="#475569" text-anchor="middle">React · TypeScript</text>
    </g>

    <!-- Backend boxes -->
    <g>
      <rect x="340" y="110" width="220" height="70" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="450" y="140" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">REST API</text>
      <text x="450" y="161" font-size="11" fill="#475569" text-anchor="middle">auth · practice · lessons · plans</text>

      <rect x="340" y="240" width="180" height="70" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="430" y="270" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Adaptive engine</text>
      <text x="430" y="291" font-size="11" fill="#475569" text-anchor="middle">ability · next question</text>
    </g>

    <!-- Background job boxes -->
    <g>
      <rect x="675" y="110" width="190" height="70" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="770" y="140" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Celery beat</text>
      <text x="770" y="161" font-size="11" fill="#475569" text-anchor="middle">nightly recalibration</text>

      <rect x="675" y="240" width="190" height="70" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="770" y="270" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Celery worker</text>
      <text x="770" y="291" font-size="11" fill="#475569" text-anchor="middle">AI jobs · audio · reports</text>
    </g>

    <!-- Right column -->
    <g>
      <rect x="950" y="110" width="210" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="1055" y="140" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">AI providers</text>
      <text x="1055" y="161" font-size="11" fill="#475569" text-anchor="middle">OpenAI · Anthropic · speech</text>

      <path d="M950,248 A105,8 0 0 1 1160,248 V302 A105,8 0 0 1 950,302 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <path d="M950,248 A105,8 0 0 0 1160,248" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="1055" y="279" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Object storage</text>
      <text x="1055" y="297" font-size="11" fill="#475569" text-anchor="middle">static files · audio</text>
    </g>

    <!-- Bottom row -->
    <g>
      <rect x="50" y="430" width="180" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <text x="140" y="460" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">GitHub Actions</text>
      <text x="140" y="481" font-size="11" fill="#475569" text-anchor="middle">lint · tests · deploy</text>

      <path d="M340,438 A110,8 0 0 1 560,438 V492 A110,8 0 0 1 340,492 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <path d="M340,438 A110,8 0 0 0 560,438" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="450" y="469" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
      <text x="450" y="487" font-size="11" fill="#475569" text-anchor="middle">single source of truth</text>

      <path d="M675,438 A95,8 0 0 1 865,438 V492 A95,8 0 0 1 675,492 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <path d="M675,438 A95,8 0 0 0 865,438" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="770" y="469" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Redis</text>
      <text x="770" y="487" font-size="11" fill="#475569" text-anchor="middle">queue · cache</text>

      <rect x="950" y="430" width="210" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="1055" y="460" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">External services</text>
      <text x="1055" y="481" font-size="11" fill="#475569" text-anchor="middle">Google sign-in · email · payments</text>
    </g>
  </g>
</svg>
