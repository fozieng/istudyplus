    <rect x="420" y="120" width="360" height="6" rx="3" fill="#6366f1"/>
    <text x="440" y="162" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Backend</text>
    <g fill="#eef2ff" stroke="#c7d2fe">
