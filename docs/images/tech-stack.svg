    <rect x="40" y="120" width="360" height="6" rx="3" fill="#0891b2"/>
    <text x="60" y="162" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Frontend</text>
    <g fill="#ecfeff" stroke="#a5f3fc">
      <rect x="60" y="182" width="82" height="28" rx="14"/><rect x="152" y="182" width="53" height="28" rx="14"/><rect x="215" y="182" width="110" height="28" rx="14"/>
      <rect x="60" y="220" width="125" height="28" rx="14"/><rect x="195" y="220" width="96" height="28" rx="14"/>
