    <rect x="420" y="375" width="360" height="225" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="420" y="375" width="360" height="6" rx="3" fill="#475569"/>
    <text x="440" y="417" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Cloud &amp; DevOps</text>
